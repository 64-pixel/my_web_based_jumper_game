name: Build and Deploy Jumper

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
  # Vynutíme spuštění na starším Ubuntu, kde funguje stabilní verze Pythonu a Pygbagu bez záseků
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag==0.9.3

      - name: Build game
        run: |
          python -m pygbag jumper_game_python/main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "jumper_game_python/build/web"
          publish_branch: gh-pages
          force_orphan: true
