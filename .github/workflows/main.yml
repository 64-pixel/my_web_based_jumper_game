
name: Build and Deploy Jumper

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag==0.9.3

      - name: Build game
        run: |
          python -m pygbag --build $GITHUB_WORKSPACE/game

      - name: Inspect build output
        run: |
          echo "Searching for generated files..."
          find "$GITHUB_WORKSPACE/game/build" -maxdepth 5 -type f

          test -f "$GITHUB_WORKSPACE/game/build/web/index.html"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "game/build/web"
          publish_branch: gh-pages
          publish_dir: "game/build/jumper_game_python"
