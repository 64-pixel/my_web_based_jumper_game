
name: Build and Deploy Jumper

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag

      - name: Build game
        run: |
          python -m pygbag --build --version 0.9.3 jumper_game_python/main.py

      - name: Verify build
        run: |
          test -f jumper_game_python/build/web/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: jumper_game_python/build/web
          publish_branch: gh-pages
          force_orphan: true
