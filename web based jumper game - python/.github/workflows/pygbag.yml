
name: pygbag_build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build Pygame for web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pygbag
        run: python -m pip install pygbag

      - name: Build game
        run: python -m pygbag --build "web based jumper game - python/main.py"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web based jumper game - python/build/web
